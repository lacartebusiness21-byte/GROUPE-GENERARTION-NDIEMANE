function cot(){const sel=`<select onchange="cur=this.value;draw()">${MS.map(x=>`<option value="${x.k}" ${x.k==cur?'selected':''}>${x.l}</option>`).join('')}</select>`;

<div class="c">${S.members.map(m=>{const p=paid(m.id,cur),st=p>=S.cotis?['Payé','']:p>0?['Partiel','wa']:['Impayé','ko'];

function edP(id){const m=S.members.find(x=>x.id==id);modal('Cotisation – '+esc(m.name),[{l:'Montant versé (F CFA)',t:'number',v:paid(id,cur)}],v=>pay(id,cur,Math.max(0,+v[0]||0)))}

function cai(){const l=[...S.mov].sort((a,b)=>b.d.localeCompare(a.d));

<div class="c row"><button class="b s" onclick="recap('png')">Récap PNG</button><button class="b s" onclick="recap('pdf')">Récap PDF</button><button class="b s" onclick="csv()">Exporter CSV</button><button class="b s" onclick="bk()">Sauvegarde JSON</button><button class="b s" onclick="fi.click()">Restaurer</button><button class="b s" onclick="window.print()">Imprimer</button><input type="file" id="fi" hidden accept=".json" onchange="rs(this)"></div>
